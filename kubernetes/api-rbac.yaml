apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-monitor-api
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-monitor-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-monitor-reader-binding
subjects:
  - kind: ServiceAccount
    name: kube-monitor-api
    namespace: default

roleRef:
  kind: ClusterRole
  name: kube-monitor-reader
  apiGroup: rbac.authorization.k8s.io
services:

  frontend:
    image: 798319585604.dkr.ecr.us-east-1.amazonaws.com/kube-monitor-web-ecr-repo:v1
    container_name: web-container
    build:
      ./frontend
    ports:
      - "3000:3000"  
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: 798319585604.dkr.ecr.us-east-1.amazonaws.com/kube-monitor-api-ecr-repo:v1
    container_name: api-container
    build:
      ./backend
    ports:
      - "8000:8000"  
    restart: unless-stopped
    environment:
      AWS_REGION: us-east-1
      AWS_PROFILE: default
      KUBECONFIG: /root/.kube/config
    volumes:
      - ${HOME}/.kube:/root/.kube:ro
      - ${HOME}/.aws:/root/.aws:ro